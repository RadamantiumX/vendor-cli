name: Eslint

on:
    push:
        branches: ["main"]
    pull_request:
        types: [opened, synchronize]

jobs:
    eslint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0 
            - uses: actions/setup-node@v4
              with:
                node-version: 22
            - name: Install dependencies
              run: npm ci
            - name: Eslint
              run: npm run lint  